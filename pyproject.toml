[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flegmgui"
version = "0.1.0"
description = "A small custom Python GUI library built directly on the Windows API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]

[tool.setuptools.packages.find]
where = ["src"]
